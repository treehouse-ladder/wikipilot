name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub Merge Queue dispatches CI against a synthetic merge_group ref
  # (PR + base preview). Required so the queue can verify CI is green
  # against the *would-be* merge state, not just the PR head. Without
  # this trigger the queue waits forever for a check that never runs.
  merge_group:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest + wikipilot lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: pytest
        env:
          # `gh auth status` (used by scripts/preflight.py) honors GH_TOKEN.
          # Surface the runner's automatic token so the preflight tests don't
          # fail on a clean GH Actions image; production routines have this
          # set the same way.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run pytest -q

      - name: Compute changed paths (for ownership lint)
        id: changed
        if: github.event_name == 'pull_request'
        env:
          # `gh pr view` reads the same merge-base diff that powers GitHub's
          # "Files changed" tab, so it ignores commits that landed on `main`
          # while the PR was open. The bare `git diff base..head` fallback
          # used to mis-flag such commits as "changed by the PR" — and on
          # claude/* branches that tripped ownership-violation for files
          # like docs/routines-setup.md the PR never actually touched.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          paths=$(gh pr view "${{ github.event.pull_request.number }}" \
            --json files --jq '.files[].path' | tr '\n' ' ')
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

      - name: wikipilot lint wiki/ (with ownership check on PRs)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args=()
            for p in ${{ steps.changed.outputs.paths }}; do
              args+=(--changed-path "$p")
            done
            uv run wikipilot lint wiki/ \
              --branch "${{ github.head_ref }}" \
              "${args[@]}"
          else
            uv run wikipilot lint wiki/
          fi

      - name: wikipilot dry-run smoke (proposal apply path)
        run: |
          mkdir -p /tmp/dryrun-vault
          uv run wikipilot init-vault /tmp/dryrun-vault
          # Provide a tiny topics.yaml so dry-run has something to chew on.
          cat > /tmp/dryrun-topics.yaml <<'EOF'
          topics:
            - id: smoke
              display_name: "Smoke topic"
              purpose: "Smoke-test the dry-run path during CI."
          EOF
          # Seed the two prerequisite slugs the dry-run fake-proposal hardcodes
          # (the production unit tests rely on these existing in the
          # tests/fixtures/sample_vault/ checkout, but a fresh init-vault
          # doesn't have them).
          mkdir -p /tmp/dryrun-vault/concepts /tmp/dryrun-vault/sources
          cat > /tmp/dryrun-vault/concepts/transformer-attention.md <<'EOF'
          ---
          title: "Transformer attention"
          kind: concept
          sources: ["[[example-paper-aabbccdd]]"]
          last_updated: 2026-05-11
          last_verified: 2026-05-11
          freshness_window_days: 30
          ---

          ## Summary

          Stub concept page seeded by the CI dry-run smoke test.

          ## See also

          _no contradictions or gaps known yet (last reviewed: 2026-05-11)_
          EOF
          cat > /tmp/dryrun-vault/sources/example-paper-aabbccdd.md <<'EOF'
          ---
          title: "Example paper"
          kind: source
          url: "https://example.com/paper"
          sha256: "aabbccdd00000000000000000000000000000000000000000000000000000000"
          fetched_at: "2026-05-11T00:00:00Z"
          topic: "smoke"
          image_count: 0
          sources: []
          last_updated: 2026-05-11
          last_verified: 2026-05-11
          freshness_window_days: 365
          ---

          ## Excerpts

          > Stub source page seeded by the CI dry-run smoke test.
          EOF
          uv run wikipilot dry-run --topic smoke \
            --vault /tmp/dryrun-vault --topics /tmp/dryrun-topics.yaml
          uv run wikipilot dry-run --query "what is the smoke topic?" \
            --vault /tmp/dryrun-vault --topics /tmp/dryrun-topics.yaml
          uv run wikipilot dry-run --weekly-health \
            --vault /tmp/dryrun-vault --topics /tmp/dryrun-topics.yaml
          uv run wikipilot lint /tmp/dryrun-vault

      - name: wikipilot recover-prs smoke (dry-run, never mutates)
        # `recover-prs --dry-run` enumerates open `claude/*` PRs and runs
        # `evaluate_gate` per PR without touching `gh pr merge` or
        # `gh pr comment`. The smoke catches CLI regressions early —
        # without it the subcommand could rot silently between routine
        # invocations. Uses the actions-runner GH_TOKEN so `gh pr list`
        # works against the real repo (no mutations, dry-run guarantees).
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run wikipilot recover-prs --dry-run --config wikipilot.toml
