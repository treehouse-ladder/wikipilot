# wikipilot.toml — operational configuration.
#
# HUMAN-OWNED. The Python lint will fail if a `claude/*` branch modifies it.
# Per-route auto-merge thresholds, image policy, and other knobs live here.
#
# Phases 3 and 5 fill out the implementation that reads this file. Defaults
# below are sized for Karpathy's "10–15 pages per source" reality.

[automerge.common]
require_lint_green = true
require_tests_green = true
block_human_only_file_changes = true

[automerge.daily_research]
# One PR per topic per day. Phase 9 raises these from 40 / 1500 to accommodate
# the inclusion-biased researcher (see CLAUDE.md "Cross-cutting relevance
# criteria"): a busy day commonly produces 6-8 sources × 10-15 page touches.
# A topic that hits the 20-source safety cap blows through the gate by
# design — that's the signal that a human should eyeball the run.
max_files_changed_per_topic = 80
max_total_diff_lines_per_topic = 3000

[automerge.wiki_query]
# One PR per question. Sized for one answer page + back-fill on a few related pages.
max_files_changed = 8
max_total_diff_lines = 400

[automerge.weekly_health]
# One PR per week. Sweep can touch many pages with small Disputes-section additions.
max_files_changed = 60
max_total_diff_lines = 2000

[automerge.conflict_resolver]
# Centralized trust model for every code path that may queue
# `gh pr merge --squash --auto`. Read by `wikipilot.git_ops.is_pr_trusted`,
# which is called from `apply_static_gate` (the in-routine
# `maybe_automerge.py` shim), `apply_gate` (`wikipilot recover-prs`),
# and the Conflict Resolver scan. A PR is treated as "trusted enough to
# auto-merge" only when its head ref lives in this repo (not a fork)
# AND either its GitHub `author_association` is in `trusted_associations`
# OR its `author.login` is in `trusted_authors`. Every other PR — including
# a fork PR with a synthetic `claude/daily-…` branch name — fails the
# gate's trust criterion and lands in the review-checklist comment path
# instead of auto-merge. See CLAUDE.md "Conflict resolution workflow"
# for the threat model this closes.
#
# `OWNER` only fires on user-owned repos (e.g. `someuser/wikipilot`);
# org-owned repos like `treehouse-ladder/wikipilot` get `MEMBER` even
# for the org owner. `COLLABORATOR` covers contributors explicitly
# invited via Settings → Collaborators.
trusted_associations = ["OWNER", "MEMBER", "COLLABORATOR"]

# Optional allowlist of GitHub logins, independent of association.
# Use sparingly — only for bot accounts or one-off contributors you've
# decided to trust without granting them org/collaborator status. An
# empty list (the default) means the trust check relies entirely on
# `trusted_associations`.
trusted_authors = []

[images]
enabled = true
max_image_bytes = 5_242_880  # 5 MB
allowed_mimes = [
  "image/png",
  "image/jpeg",
  "image/gif",
  "image/webp",
  "image/svg+xml",
]
cleanup_orphans = true

[branches]
prefix = "claude"  # Claude Code Cloud restricts pushes to `claude/*` branches by default.
daily_template = "claude/daily-{date}/{topic_id}"
query_template = "claude/query-{date}-{slug}"
health_template = "claude/health-{date}"
