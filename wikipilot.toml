# wikipilot.toml — operational configuration.
#
# HUMAN-OWNED. The Python lint will fail if a `claude/*` branch modifies it.
# Per-route auto-merge thresholds, image policy, and other knobs live here.
#
# Phases 3 and 5 fill out the implementation that reads this file. Defaults
# below are sized for Karpathy's "10–15 pages per source" reality.

[automerge.common]
require_lint_green = true
require_tests_green = true
block_human_only_file_changes = true

[automerge.daily_research]
# One PR per topic per day. Phase 9 raises these from 40 / 1500 to accommodate
# the inclusion-biased researcher (see CLAUDE.md "Cross-cutting relevance
# criteria"): a busy day commonly produces 6-8 sources × 10-15 page touches.
# A topic that hits the 20-source safety cap blows through the gate by
# design — that's the signal that a human should eyeball the run.
max_files_changed_per_topic = 80
max_total_diff_lines_per_topic = 3000

[automerge.wiki_query]
# One PR per question. Sized for one answer page + back-fill on a few related pages.
max_files_changed = 8
max_total_diff_lines = 400

[automerge.weekly_health]
# One PR per week. Sweep can touch many pages with small Disputes-section additions.
max_files_changed = 60
max_total_diff_lines = 2000

[automerge.conflict_resolver]
# Centralized trust model for every code path that may queue
# `gh pr merge --squash --auto`. Read by `wikipilot.git_ops.is_pr_trusted`,
# which is called from `apply_static_gate` (the in-routine
# `maybe_automerge.py` shim), `apply_gate` (`wikipilot recover-prs`),
# and the Conflict Resolver scan. A PR is treated as "trusted enough to
# auto-merge" only when its head ref lives in this repo (not a fork)
# AND either its GitHub `author_association` is in `trusted_associations`
# OR its `author.login` is in `trusted_authors`. Every other PR — including
# a fork PR with a synthetic `claude/daily-…` branch name — fails the
# gate's trust criterion and lands in the review-checklist comment path
# instead of auto-merge. See CLAUDE.md "Conflict resolution workflow"
# for the threat model this closes.
#
# `OWNER` only fires on user-owned repos (e.g. `someuser/wikipilot`);
# org-owned repos like `treehouse-ladder/wikipilot` get `MEMBER` even
# for the org owner. `COLLABORATOR` covers contributors explicitly
# invited via Settings → Collaborators.
trusted_associations = ["OWNER", "MEMBER", "COLLABORATOR"]

# Optional allowlist of GitHub logins, independent of association.
# Use sparingly — only for bot accounts or one-off contributors you've
# decided to trust without granting them org/collaborator status. An
# empty list (the default) means the trust check relies entirely on
# `trusted_associations`.
trusted_authors = []

# Lint rule codes the `wiki-lint-fixer` Opus subagent is allowed to attempt
# when the Conflict Resolver routine triages a BLOCKED PR (Phase 11). Mirrors
# `wikipilot.git_ops.DEFAULT_AUTO_FIX_LINT_CATEGORIES` and the allowlist
# documented in `.claude/agents/wiki-lint-fixer.md`. Override to widen or
# narrow per deployment. NEVER add `ownership-violation` — it's a security
# boundary that exists precisely to require human review of any Claude branch
# edit to CLAUDE.md / topics.yaml / wiki/topics/<id>/purpose.md.
# `tool-profile` is deliberately NOT auto-fixable either: a failing profile
# field means a value was guessed or mis-typed, and the fixer must not invent
# `unknown` / enum values to make lint pass — a human or the researcher decides.
auto_fix_lint_categories = [
  "broken-wikilink",
  "broken-image-ref",
  "frontmatter",
  "log-format",
]

[images]
enabled = true
max_image_bytes = 5_242_880  # 5 MB
allowed_mimes = [
  "image/png",
  "image/jpeg",
  "image/gif",
  "image/webp",
  "image/svg+xml",
]
cleanup_orphans = true

[branches]
prefix = "claude"  # Claude Code Cloud restricts pushes to `claude/*` branches by default.
daily_template = "claude/daily-{date}/{topic_id}"
query_template = "claude/query-{date}-{slug}"
health_template = "claude/health-{date}"

[frontier_models]
# Roster of entities the frontier-models topic-researcher sweeps every day.
# Each entry must have a `wiki/entities/<slug>.md` page eventually; missing
# pages render as `_unknown_` rows in the comparison tables until the
# researcher creates them.
roster = [
  "claude-fable-5",
  "claude-opus-4.8",
  "claude-sonnet-4.6",
  "gpt-5.5",
  "gemini-3.1-pro",
  "grok-4.3",
  "deepseek-v4",
  "glm-5",
  "kimi-k2.6",
  "qwen3.7-max",
]

# Benchmark frontmatter fields the researcher re-confirms daily and the
# `benchmark-leaders` comparison page aggregates.
benchmarks = [
  "aa_intelligence_index",
  "gdpval_aa_elo",
  "swe_bench_verified",
  "cybergym",
  "arc_agi_2",
]

# Cost frontmatter fields the researcher re-confirms daily and the
# `cost-comparison` page aggregates. Lower-is-better; the comparison
# renderer inverts leader ordering for any column listed here.
cost_fields = [
  "input_cost_per_mtoken",
  "output_cost_per_mtoken",
]

# One-line "what being good at this means FOR ME" gloss per benchmark,
# in the game-dev + agentic-workflow lens. Used by compare.py to render
# a legend above the benchmark-leaders table, and by the
# daily-brief-curator when explaining a leader change in plain language.
# Human-owned (the wiki routines never edit wikipilot.toml). Keep each
# gloss to ~1 line. Adding a benchmark without writing its gloss fails
# config load on purpose.
[frontier_models.benchmark_glosses]
aa_intelligence_index = "Aggregate intelligence (avg across many evals). High = strong generalist; the right default daily-driver for agentic coding."
gdpval_aa_elo = "Real-world economic-task quality vs. human experts. High = ships agentic work to production with fewer reverts."
swe_bench_verified = "Resolves real GitHub issues end-to-end (curated subset). High = stronger refactor/bugfix agent inside your game project."
cybergym = "Agentic cyber-CTF tasks (CyberGym is the active successor to the now-saturated original Cybench). High = robust under adversarial prompts; proxy for hard agentic resilience."
arc_agi_2 = "Abstract pattern reasoning resistant to training-set memorization. High = bigger upside on novel game mechanics + puzzle design."

[frontier_models.cost_glosses]
input_cost_per_mtoken = "USD/Mtoken input. Lower = cheaper to feed long codebases + cached prompts to the agent."
output_cost_per_mtoken = "USD/Mtoken output. Lower = cheaper for long-running parallel-agent sessions."

[tool_profiles]
# Machine-readable profile carried by entity pages with `profile: tool`
# (generative-media + 3D/rig/motion tools). See CLAUDE.md "Tool entity
# profile". Read by the `tool-profile` lint rule, `wikipilot tools`,
# `wikipilot tool-changes`, the comparison pages, and the topic-researcher
# roster sweep. Human-owned.
#
# There is deliberately NO static roster here: the roster for a topic is
# DERIVED at run time as "every `profile: tool` entity whose `modality`
# maps to that topic in `modality_topics`". A new tool entity proposed via
# a researcher `page_diff` joins the sweep on the next run with no edit to
# this file.
modalities = ["image", "video", "3d", "rig", "motion", "music", "sfx", "voice", "sprite"]

# Allowed values for the list-valued `access` field. A tool typically has
# several (e.g. open-weights AND fal). The benchmark scout's admission
# rule is "any of api | fal | replicate | open-weights". `web` = hosted
# web app / studio UI with no stated API; `none` = no public access path
# (research-only); `unknown` = no ingested source states how it is reached.
access_values = ["api", "fal", "replicate", "open-weights", "web", "desktop", "none", "unknown"]

# Allowed values for `status`.
status_values = ["active", "preview", "deprecated", "shutdown"]

# `model_ids` entries may be prefixed with an aggregator name to carry the
# endpoint id (e.g. `fal:fal-ai/hunyuan3d-v21`, `replicate:tencent/hunyuan3d-2`).
# Unprefixed entries are the vendor's own id.
model_id_prefixes = ["fal", "replicate"]

# Fields the roster sweep re-confirms every run and `tool-changes` diffs.
# Each carries a sibling `<field>_source` (wikilink or null; a list for
# `arena_rank`).
tracked_fields = ["status", "pricing", "commercial_use", "arena_rank"]

# Which topic owns (and sweeps) each modality. Every entry in `modalities`
# MUST appear here — config load fails otherwise.
[tool_profiles.modality_topics]
image = "generative-media-models"
video = "generative-media-models"
music = "generative-media-models"
sfx = "generative-media-models"
voice = "generative-media-models"
sprite = "generative-media-models"
"3d" = "ai-in-game-dev"
rig = "ai-in-game-dev"
motion = "ai-in-game-dev"
